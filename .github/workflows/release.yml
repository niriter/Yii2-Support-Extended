name: Build plugin release

on:
  push:
    tags:
      - "**"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to a GitHub Release
        required: true
        type: string

concurrency:
  group: plugin-release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.warning.mode=all
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

jobs:
  build-and-release:
    name: Build and attach installable plugin ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Derive plugin version from tag
        id: release
        shell: bash
        run: |
          plugin_version="${RELEASE_TAG#v}"
          plugin_version="${plugin_version//\//-}"

          if [[ -z "$plugin_version" ]]; then
            echo "The tag must contain a plugin version." >&2
            exit 1
          fi

          echo "plugin_version=$plugin_version" >> "$GITHUB_OUTPUT"
          echo "archive=build/distributions/yii2-navigator-$plugin_version-signed.zip" >> "$GITHUB_OUTPUT"

      - name: Run tests, build, sign, and verify plugin
        env:
          PLUGIN_VERSION: ${{ steps.release.outputs.plugin_version }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: >-
          ./gradlew
          --stacktrace
          "-PpluginVersion=$PLUGIN_VERSION"
          test
          psiIntegrationTest
          signPlugin
          verifyPluginSignature

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE_PATH: ${{ steps.release.outputs.archive }}
        shell: bash
        run: |
          if [[ ! -f "$ARCHIVE_PATH" ]]; then
            echo "Plugin archive was not created: $ARCHIVE_PATH" >&2
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "$ARCHIVE_PATH" \
              --verify-tag \
              --generate-notes
            exit 0
          fi

          asset_name="$(basename "$ARCHIVE_PATH")"
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | grep -Fqx "$asset_name"; then
            echo "Release asset already exists: $asset_name"
            exit 0
          fi

          gh release upload "$RELEASE_TAG" "$ARCHIVE_PATH"

      - name: Publish plugin to JetBrains Marketplace
        env:
          PLUGIN_VERSION: ${{ steps.release.outputs.plugin_version }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: >-
          ./gradlew
          --stacktrace
          "-PpluginVersion=$PLUGIN_VERSION"
          publishPlugin
