name: Build and verify plugin

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.warning.mode=all

jobs:
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

  build-and-test:
    name: PhpStorm ${{ matrix.platform-version }}
    needs: validate-wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform-version: "2024.1.7"
            java-version: "17"
            publish-artifact: true
          - platform-version: "2025.1.7.1"
            java-version: "21"
            publish-artifact: false
          - platform-version: "2026.1.4"
            java-version: "21"
            publish-artifact: false

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build plugin
        run: >-
          ./gradlew
          --stacktrace
          -PplatformVersion=${{ matrix.platform-version }}
          test
          buildPlugin

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-phpstorm-${{ matrix.platform-version }}
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload plugin distribution
        if: matrix.publish-artifact
        uses: actions/upload-artifact@v4
        with:
          name: yii2-support-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

  plugin-verifier:
    name: Plugin Verifier / PhpStorm ${{ matrix.platform-version }}
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform-version:
          - "2024.1.7"
          - "2025.1.7.1"
          - "2026.1.4"

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify plugin compatibility
        run: >-
          ./gradlew
          --stacktrace
          -PpluginVerifierIdeVersions=${{ matrix.platform-version }}
          verifyPlugin

      - name: Upload Plugin Verifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-phpstorm-${{ matrix.platform-version }}
          path: build/reports/pluginVerifier/**
          if-no-files-found: ignore
          retention-days: 14
